name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: functionality-data-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Offline production build validation
        run: npm run build
      - name: Ensure build does not modify checked-in airport data
        run: git diff --exit-code -- airports-index.json
      - run: npm run check
      - run: npm test
      - name: Report release blockers without deploying
        run: npm run release:report

  history-audit:
    if: github.event_name == 'pull_request'
    name: credential-history-pattern-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Audit reachable Git history without printing credential values
        run: npm run security:history
